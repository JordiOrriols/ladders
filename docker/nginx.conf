server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header Host $host;
    }
    location = /ladders { return 302 /ladders/; }
    location /ladders/assets/ { try_files $uri =404; }
    location /ladders/ {
        try_files $uri $uri/ /ladders/index.html;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
